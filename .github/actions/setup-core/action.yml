name: Prepare B-box core
description: Prepare the pinned MiChongs sing-box fork and its isolated dependency patches.

outputs:
  version:
    description: Core version from version.properties.
    value: ${{ steps.versions.outputs.version }}
  sha:
    description: Exact fork commit used for the build.
    value: ${{ steps.lock.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Read core and Go versions
      id: versions
      shell: bash
      run: |
        version=$(sed -n 's/^CORE_VERSION_NAME=//p' version.properties | tr -d '\r')
        go_version=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')
        [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]
        [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "go_version=$go_version" >> "$GITHUB_OUTPUT"

    - name: Verify the locked core commit
      id: lock
      shell: bash
      run: |
        sha=$(git -C core/sing-box rev-parse HEAD)
        test "$sha" = "$(git ls-tree HEAD core/sing-box | awk '{print $3}')"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.versions.outputs.go_version }}
        cache-dependency-path: core/sing-box/go.sum
    - name: Prepare an isolated worktree of the locked submodule
      shell: bash
      run: |
        git -C core/sing-box worktree add --detach "$GITHUB_WORKSPACE/.core" '${{ steps.lock.outputs.sha }}'
        python3 .core/b-box/prepare_dependencies.py
    - name: Resolve dependencies
      shell: bash
      working-directory: .core
      run: go mod tidy

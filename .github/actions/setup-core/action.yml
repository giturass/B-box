name: Prepare B-box core
description: Check out the B-box sing-box fork submodule and verify its upstream version.

outputs:
  version:
    description: Core version from CORE_VERSION_NAME in version.properties.
    value: ${{ steps.versions.outputs.version }}

runs:
  using: composite
  steps:
    - name: Read core and Go versions
      id: versions
      shell: bash
      run: |
        version=$(sed -n 's/^CORE_VERSION_NAME=//p' version.properties | tr -d '\r')
        go_version=$(sed -n 's/^GO_VERSION=go//p' version.properties | tr -d '\r')
        [[ "$version" =~ ^[0-9][0-9A-Za-z.+-]*$ ]]
        [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "go_version=$go_version" >> "$GITHUB_OUTPUT"
    - name: Check out the core submodule on its pinned upstream tag
      shell: bash
      env:
        CORE_VERSION: ${{ steps.versions.outputs.version }}
      run: |
        git submodule update --init --depth 1 core
        git -C core fetch --no-tags --depth 256 origin "$(git -C core rev-parse HEAD)"
        git -C core fetch --no-tags --depth 1 https://github.com/SagerNet/sing-box "refs/tags/v$CORE_VERSION"
        # The fork branch must stay based on CORE_VERSION_NAME; the local tag
        # gives the libbox builder that version, as the upstream checkout did.
        git -C core merge-base --is-ancestor FETCH_HEAD HEAD
        git -C core tag --force "v$CORE_VERSION" HEAD
        test -z "$(git -C core status --porcelain)"
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.versions.outputs.go_version }}
        cache-dependency-path: core/go.sum

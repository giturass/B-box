name: Android regression and smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-libbox
        with:
          platform: android/amd64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/setup-flutter
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Flutter debug library
        working-directory: flutter
        run: flutter build aar --no-profile --no-release --target-platform android-x64
      - name: Build emulator APK
        run: ./gradlew :app:testOtherDebugUnitTest :app:compilePlayDebugKotlin :app:assembleOtherDebug :app:assembleOtherDebugAndroidTest -PemulatorOnly=true --no-daemon --console=plain --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-unit-tests
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: |
            app/build/outputs/apk/other/debug/*-x86_64-debug.apk
            app/build/outputs/apk/androidTest/other/debug/*.apk
          if-no-files-found: error
          retention-days: 7
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [24, 31, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: emulator-apk
          path: build/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 tools/android_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-api-${{ matrix.api }}
          path: build/android-smoke/
          retention-days: 7

name: Build Release APK (arm64-v8a)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release (version tag must match this commit)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.core.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: core
        uses: ./.github/actions/build-libbox
        with:
          platform: android/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-aar-arm64
          path: app/libs/libbox.aar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Flutter Release library
        working-directory: flutter
        run: flutter build aar --no-debug --no-profile --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-aar-arm64
          path: flutter/build/host/outputs/repo/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    needs: [core, flutter]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download core library from this run
        uses: actions/download-artifact@v5
        with:
          name: libbox-aar-arm64
          path: app/libs

      - name: Set up Java for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            platforms;android-36
            platforms;android-37.1
            build-tools;36.0.0
            build-tools;37.0.0
            ndk;28.0.13004108

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Flutter Release library from this run
        uses: actions/download-artifact@v5
        with:
          name: flutter-aar-arm64
          path: flutter/build/host/outputs/repo

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASS ALIAS_NAME ALIAS_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name (see app.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          test -s app/release.keystore

      - name: Build signed Release APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          ./gradlew :app:assembleOtherRelease -Parm64Only=true \
            --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify APK identity, architecture and signature
        run: python3 tools/verify_release.py

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: B-box-${{ needs.core.outputs.version }}-arm64-v8a-release
          path: app/build/outputs/apk/other/release/*-arm64-v8a.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.core.outputs.version }}
        run: python3 tools/publish_release.py

      - name: Remove signing key
        if: always()
        run: rm -f app/release.keystore

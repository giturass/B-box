name: New UI validation

on:
  push:
    branches: [dev, newui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certificate-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Prepare BusyBox
        run: sudo apt-get update && sudo apt-get install -y busybox-static
      - name: Check module script syntax
        run: |
          for script in app/src/main/assets/capture-module/*.sh app/src/main/assets/capture-module/META-INF/com/google/android/update-binary tools/test_capture_module.sh; do
            busybox ash -n "$script"
          done
      - name: Test CA mounts in isolated Linux namespaces
        run: sudo env CAPTURE_MODULE_CI=1 unshare --mount --pid --fork --mount-proc busybox ash tools/test_capture_module.sh
  webdav:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: |
          echo "core=$(sed -n 's/^VERSION_NAME=//p' version.properties)" >> "$GITHUB_OUTPUT"
          echo "go=$(sed -n 's/^GO_VERSION=go//p' version.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ steps.versions.outputs.core }}
          path: .core
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache-dependency-path: .core/go.sum
      - name: Apply matching core patches
        working-directory: .core
        run: |
          git apply --check ../libbox/libbox-no-legacy.patch
          git apply ../libbox/libbox-no-legacy.patch
          python3 ../tools/patch_sing_tun.py .
          python3 ../tools/patch_httpdebug.py .
      - name: Android ingress-discard map compatibility tests
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 github.com/sagernet/sing-tun -run '^TestAndroidIngressDiscard' -count=1
      - name: HTTP, routed IP and LAN tests against the matching core
        working-directory: .core
        run: |
          cp ../libbox/ui_http.go ../libbox/ui_http_test.go ../libbox/ui_egress.go ../libbox/ui_egress_test.go ../libbox/ui_lan.go ../libbox/ui_lan_test.go ../libbox/ui_capture_test.go experimental/libbox/
          go test -ldflags=-checklinkname=0 ./experimental/libbox -run '^TestUI(WebDAV|HTTPGet|Egress|LAN|Capture)' -count=1
      - name: HTTP capture, rewrite, script, storage and route tests
        working-directory: .core
        run: |
          go test -race ./experimental/httpdebug -count=1
          go test -ldflags=-checklinkname=0 ./route -run '^TestBboxHTTPDebug' -count=1
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/verify_newui.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Resolve and analyze Flutter
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Flutter interaction and layout tests
        working-directory: flutter
        run: flutter test --reporter expanded
      - name: Build Flutter Android libraries
        working-directory: flutter
        run: flutter build aar --no-profile --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newui-validation
          path: |
            flutter/pubspec.lock
            flutter/test/failures/
            flutter/build/screenshots/
            flutter/build/host/outputs/repo/
          retention-days: 7

name: New UI validation

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webdav:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - id: versions
        run: |
          echo "core=$(sed -n 's/^VERSION_NAME=//p' version.properties)" >> "$GITHUB_OUTPUT"
          echo "go=$(sed -n 's/^GO_VERSION=go//p' version.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: v${{ steps.versions.outputs.core }}
          path: .core
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache-dependency-path: .core/go.sum
      - name: HTTP and routed IP probe tests against the matching core
        working-directory: .core
        run: |
          git apply ../patches/libbox-no-legacy.patch
          cp ../libbox/ui_http.go ../libbox/ui_http_test.go ../libbox/ui_egress.go ../libbox/ui_egress_test.go ../libbox/ui_lan.go ../libbox/ui_lan_test.go experimental/libbox/
          go test -ldflags=-checklinkname=0 ./experimental/libbox -run '^TestUI(WebDAV|HTTPGet|Egress|LAN)' -count=1
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/verify_newui.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Resolve and analyze Flutter
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
      - name: Flutter interaction and layout tests
        working-directory: flutter
        run: flutter test --reporter expanded
      - name: Build Flutter Android libraries
        working-directory: flutter
        run: flutter build aar --no-profile --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newui-validation
          path: |
            flutter/pubspec.lock
            flutter/test/failures/
            flutter/build/screenshots/
            flutter/build/host/outputs/repo/
          retention-days: 7

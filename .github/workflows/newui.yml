name: Core and Flutter validation

on:
  push:
    branches: [dev, newui]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [dev, newui]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    needs: ebpf
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-core
      - uses: actions/download-artifact@v4
        with:
          pattern: gotls-wire-validation-*
          path: ${{ runner.temp }}/gotls-wire-validation
      - name: Independent pcapng decoder
        run: sudo apt-get update -qq && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark
      - name: Android ingress-discard map compatibility tests
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 github.com/sagernet/sing-tun -run '^TestAndroidIngressDiscard' -count=1
      - name: HTTP, routed IP and LAN tests against the matching core
        working-directory: .core
        run: go test -ldflags=-checklinkname=0 ./experimental/libbox -run '^TestUI' -count=1
      - name: HTTP and eBPF capture, storage and route tests
        working-directory: .core
        env:
          BBOX_WIRE_FIXTURE_DIR: ${{ runner.temp }}/gotls-wire-validation
        run: |
          go test -race ./experimental/httpdebug -count=1
          go test -ldflags=-checklinkname=0 ./route -run '^TestBboxHTTPDebug' -count=1
  ebpf:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - id: go
        run: echo "version=$(sed -n 's/^GO_VERSION=go//p' version.properties)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: tools/ebpf/go.sum
      - run: sudo apt-get update -qq && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y clang llvm libssl-dev tshark
      - id: collector_build
        run: bash tools/ebpf/build.sh linux/${{ matrix.arch }}
      - name: Collector framing, ordering, symbol and platform tests
        working-directory: tools/ebpf
        run: go test -mod=readonly -race -count=1 ./...
      - name: Root uprobe TLS smoke and owner shutdown
        run: sudo python3 tools/ebpf/smoke.py
      - name: Stored APK uprobes, automatic offsets and TLS lifetime smoke
        if: ${{ !cancelled() && steps.collector_build.outcome == 'success' && matrix.arch == 'amd64' }}
        run: sudo python3 tools/ebpf/apk_smoke.py
      - name: Go TLS clients across supported ABIs and stripped PIE
        if: ${{ !cancelled() && steps.collector_build.outcome == 'success' }}
        run: |
          mkdir -p "$HOME/tmp/bbox-go-tls"
          for fixture_go in go1.24.0 go1.25.0 go1.26.10; do
            for fixture_link in internal external; do
              GOTOOLCHAIN="$fixture_go" CGO_ENABLED=1 go build -trimpath -buildmode=pie \
                -ldflags="-s -w -linkmode=$fixture_link" \
                -o "$HOME/tmp/bbox-go-tls/$fixture_go-$fixture_link" tools/ebpf/testdata/go_tls_client.go
              sudo python3 tools/ebpf/gotls_smoke.py "$HOME/tmp/bbox-go-tls/$fixture_go-$fixture_link"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gotls-wire-validation-${{ matrix.arch }}
          path: tools/ebpf/build/gotls/
          retention-days: 7
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/verify_newui.py
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Analyze Flutter
        working-directory: flutter
        run: flutter analyze --no-fatal-infos
      - name: Flutter interaction and layout tests
        working-directory: flutter
        run: flutter test --reporter expanded
      - name: Build Flutter Android libraries
        working-directory: flutter
        run: flutter build aar --no-profile --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newui-validation
          path: |
            flutter/test/failures/
            flutter/build/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: flutter-aar-arm64
          path: flutter/build/host/outputs/repo/
          if-no-files-found: error
          retention-days: 7

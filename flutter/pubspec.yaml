name: b_box_ui
description: B-box Android interface, using FlClash presentation and sing-box services.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  prism_ui:
    path: packages/prism_ui
  collection: 1.19.1
  mobile_scanner: 7.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  assets:
    - assets/images/
    - assets/fonts/
    - assets/licenses/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: Twemoji
      fonts:
        - asset: assets/fonts/Twemoji.Mozilla.ttf
  module:
    androidX: true
    androidPackage: io.ericlee.bbox_ui
    iosBundleIdentifier: io.ericlee.bboxUi
